<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel da Gangue</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="gang-panel" class="container hidden">
        <header class="panel-header">
            <div class="gang-title">
                <i class="fa-solid fa-shield-halved header-icon"></i>
                <h1 id="gang-label-display">PAINEL DE GANGUES</h1>
                <span class="badge" id="gang-level-display">LVL 1</span>
            </div>
            <button class="close-btn" onclick="closePanel()"><i class="fa-solid fa-xmark"></i></button>
        </header>

        <div id="no-gang-section" class="section hidden">
            <div class="create-card">
                <h2><i class="fa-solid fa-square-plus"></i> Registre sua Equipe / Gangue</h2>
                <p>Você não pertence a nenhuma organização. Registre uma equipe abaixo.</p>
                <div class="input-group">
                    <label>Nome Curto (ID):</label>
                    <input type="text" id="create-gang-name" placeholder="ex: racing">
                </div>
                <div class="input-group">
                    <label>Nome de Exibição (Label):</label>
                    <input type="text" id="create-gang-label" placeholder="ex: Racing Club">
                </div>
                <p class="cost-info">Custo: <strong id="creation-cost-val">$50.000</strong></p>
                <button class="btn btn-green btn-full" onclick="submitCreateGang()">Criar Organização</button>
            </div>
        </div>

        <div id="has-gang-section" class="section hidden">
            <div class="stats-grid">
                <div class="card stat-card">
                    <i class="fa-solid fa-vault color-gold"></i>
                    <div class="stat-info">
                        <span class="label">Cofre</span>
                        <h2 id="gang-bank-balance">$0</h2>
                    </div>
                </div>
                <div class="card stat-card">
                    <i class="fa-solid fa-warehouse color-blue"></i>
                    <div class="stat-info">
                        <span class="label">Base</span>
                        <h2 id="gang-base-id">Nenhuma</h2>
                    </div>
                </div>
                <div class="card stat-card">
                    <i class="fa-solid fa-flag color-red"></i>
                    <div class="stat-info">
                        <span class="label">Territórios</span>
                        <h2 id="gang-turfs-count">0</h2>
                    </div>
                </div>
                <div class="card stat-card">
                    <i class="fa-solid fa-house-flag color-green"></i>
                    <div class="stat-info">
                        <span class="label">Vilas / GZs</span>
                        <h2 id="gang-vilas-gz">0 / 0</h2>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="card section-card">
                    <h3><i class="fa-solid fa-users"></i> Membros</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Cargo</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="members-list"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card section-card actions-card">
                    <h3><i class="fa-solid fa-gears"></i> Ações</h3>
                    <div class="bank-inputs">
                        <input type="number" id="bank-amount-input" placeholder="Valor ($)">
                        <div class="btn-group">
                            <button class="btn btn-green" onclick="submitDeposit()">Depositar</button>
                            <button class="btn btn-red" onclick="submitWithdraw()">Sacar</button>
                        </div>
                    </div>
                    <div class="invite-box">
                        <input type="number" id="invite-id-input" placeholder="ID Jogador">
                        <button class="btn btn-blue" onclick="submitInvite()">Convidar</button>
                    </div>
                    <div class="war-stats-box">
                        <h4><i class="fa-solid fa-crosshairs"></i> Estatísticas</h4>
                        <div class="stat-row"><span>Kills:</span> <strong id="total-kills">0</strong></div>
                        <div class="stat-row"><span>Deaths:</span> <strong id="total-deaths">0</strong></div>
                        <div class="stat-row"><span>K/D:</span> <strong id="kd-ratio">0.00</strong></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="panel-footer">
            <button class="btn btn-close" onclick="closePanel()">Fechar</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
