<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="scoreboard-container" class="hidden">
        <div class="header">
            <span class="title">CLASSIC GANG WAR - STATS PLAYERS</span>
            <span id="online-count" class="badge">0 ONLINE</span>
        </div>

        <table class="scoreboard-table">
            <thead>
                <tr>
                    <th style="width: 8%;">ID</th>
                    <th style="width: 27%;">NOME</th>
                    <th style="width: 18%;">GANGUE</th>
                    <th style="width: 17%;">DINHEIRO</th>
                    <th style="width: 11%;">K/D SESSÃO</th>
                    <th style="width: 11%;">K/D GERAL</th>
                    <th style="width: 8%;">PING</th>
                </tr>
            </thead>
            <tbody id="player-list">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
